name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify distributed checksums
        run: sha256sum -c SHA256SUMS.txt
      - name: Run tests
        run: python -m unittest discover -s tests -q
      - name: Run worked example
        run: python -m edgeguardra worked-example
      - name: Validate policy
        run: python -m edgeguardra check-policy examples/policy.json
      - name: Install and run outside source
        shell: bash
        run: |
          python -m pip install 'setuptools>=61'
          python -m pip install --no-deps --no-build-isolation .
          cd "$RUNNER_TEMP"
          python -m edgeguardra --version
          python -m edgeguardra worked-example
