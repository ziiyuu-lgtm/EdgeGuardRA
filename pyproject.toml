[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "edgeguardra"
version = "0.22.0"
description = "Research prototype for risk-aware simulated IoT agent actions"
requires-python = ">=3.10"
authors = [{name = "Yang Lu", email = "yanglu@klust.edu.cn"}]
readme = "README.md"

[project.scripts]
edgeguardra = "edgeguardra.__main__:main"

[tool.setuptools.packages.find]
include = ["edgeguardra*"]
